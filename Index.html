<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณราคาทอง / เงิน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient-start: #4a0000;
            --bg-gradient-end: #1a0000;
            --primary-red: #B71C1C;
            --hover-red: #D32F2F;
            --accent-red: #F44336;
            --light-red-bg: #FFEBEE;
            --dark-gray: #37474F;
            --hover-gray: #263238;
            --light-gray-bg: #ECEFF1;
            --card-radius: 30px;
            --input-height: 70px;
            --button-height: 70px;
        }

        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 100%; 
        }

        .header-title {
            font-size: 2.8rem;
            font-weight: 700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: #FFFFFF;
            letter-spacing: 1px;
        }

        .header-clock {
            font-size: 1.6rem;
            font-weight: 400;
            color: #FFCDD2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .pos-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: var(--card-radius);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 35px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pos-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .card-gold-title {
            color: var(--primary-red);
            font-size: 2rem;
            font-weight: 700;
            border-bottom: 4px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-silver-title {
            color: var(--dark-gray);
            font-size: 2rem;
            font-weight: 700;
            border-bottom: 4px solid var(--dark-gray);
            padding-bottom: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .form-label {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }

        .form-control {
            height: var(--input-height);
            font-size: 1.6rem;
            font-weight: 600;
            border: 2px solid #ced4da;
            border-radius: 15px !important;
            padding: 10px 20px;
            color: #000000;
            background-color: #ffffff;
        }

        .form-control:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 0.25rem rgba(244, 67, 54, 0.25);
            background-color: #ffffff;
            color: #000000;
        }

        .form-control.is-invalid {
            border-color: #dc3545;
            background-image: none;
        }

        .invalid-feedback {
            display: block;
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .btn-fetch-inline {
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            padding: 6px 18px;
            margin-bottom: 8px;
            float: right;
            border: none;
            transition: all 0.2s;
            cursor: pointer;
        }
        .btn-fetch-gold { background-color: #FFE082; color: #5D4037; }
        .btn-fetch-gold:hover { background-color: #FFD54F; }
        .btn-fetch-silver { background-color: #CFD8DC; color: #37474F; }
        .btn-fetch-silver:hover { background-color: #B0BEC5; }

        .btn-calc {
            height: var(--button-height);
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 15px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
        }

        .btn-gold { background-color: var(--primary-red); color: white; border: none; }
        .btn-gold:hover { background-color: var(--hover-red); box-shadow: 0 6px 15px rgba(183, 28, 28, 0.4); }

        .btn-silver { background-color: var(--dark-gray); color: white; border: none; }
        .btn-silver:hover { background-color: var(--hover-gray); box-shadow: 0 6px 15px rgba(55, 71, 79, 0.4); }

        .btn-clear {
            height: var(--button-height);
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 15px;
            background-color: #e0e0e0;
            color: #333;
            border: none;
            cursor: pointer;
        }
        .btn-clear:hover { background-color: #d6d6d6; }

        .result-box-gold {
            background-color: var(--light-red-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            border: 2px dashed rgba(183, 28, 28, 0.3);
        }

        .result-box-silver {
            background-color: var(--light-gray-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            border: 2px dashed rgba(55, 71, 79, 0.3);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .result-row:not(:last-child) { border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .result-label { font-size: 1.2rem; font-weight: 500; color: #555555; }
        .result-value-sm { font-size: 1.6rem; font-weight: 700; color: #222222; }
        .result-label-lg { font-size: 1.5rem; font-weight: 700; color: #000000; }
        .result-value-lg-gold { font-size: 2.6rem; font-weight: 800; color: var(--primary-red); text-shadow: 1px 1px 0px #fff; }
        .result-value-lg-silver { font-size: 2.6rem; font-weight: 800; color: var(--dark-gray); text-shadow: 1px 1px 0px #fff; }

        @media (max-width: 768px) {
            .header-title { font-size: 2rem; }
            .header-clock { font-size: 1.2rem; padding: 6px 15px; }
            .pos-card { padding: 20px; margin-bottom: 20px; }
            .card-gold-title, .card-silver-title { font-size: 1.6rem; }
            .form-label { font-size: 1.1rem; }
            .form-control { font-size: 1.4rem; height: 60px; }
            .btn-calc, .btn-clear { height: 60px; font-size: 1.3rem; }
            .result-value-lg-gold, .result-value-lg-silver { font-size: 2.2rem; }
            .btn-fetch-inline { padding: 4px 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container-fluid px-4 px-md-5 my-auto">
        <header class="text-center mb-4 mb-md-5">
            <h1 class="header-title mb-3">
                <i class="bi bi-calculator-fill me-2 text-warning"></i>โปรแกรมคำนวณราคาทอง / เงิน
            </h1>
            <div class="header-clock" id="liveClock">กำลังโหลดวันที่และเวลา...</div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <div class="col-12 col-xl-6">
                <div class="pos-card">
                    <div>
                        <h2 class="card-gold-title">
                            <i class="bi bi-trophy-fill text-warning"></i> คำนวณราคาทอง
                        </h2>
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <button class="btn btn-fetch-inline btn-fetch-gold" id="btnGetGold">
                                    <i class="bi bi-cloud-download-fill me-1"></i> กดดึงราคารับซื้อสมาคมฯ
                                </button>
                                <label for="goldPrice" class="form-label">ราคารับซื้อประจำวัน (บาท)</label>
                                <input type="number" id="goldPrice" class="form-control" step="any" min="0">
                                <div class="invalid-feedback" id="goldPriceError"></div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="goldPercent" class="form-label">เปอร์เซ็นต์ (%) </label>
                                <input type="number" id="goldPercent" class="form-control" step="any" min="0" max="100">
                                <div class="invalid-feedback" id="goldPercentError"></div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="goldWeight" class="form-label">น้ำหนัก (กรัม)</label>
                                <input type="number" id="goldWeight" class="form-control" step="any" min="0">
                                <div class="invalid-feedback" id="goldWeightError"></div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="row g-2">
                            <div class="col-8">
                                <button class="btn btn-calc btn-gold w-100" id="btnCalcGold">
                                    <i class="bi bi-play-circle-fill"></i> คำนวณราคาทอง
                                </button>
                            </div>
                            <div class="col-4">
                                <button class="btn btn-clear w-100" id="btnClearGold">ล้างค่า</button>
                            </div>
                        </div>

                        <div class="result-box-gold">
                            <div class="result-row">
                                <span class="result-label">ทองราคาต่อกรัม:</span>
                                <span class="result-value-sm" id="goldPerGram">0.00 บาท</span>
                            </div>
                            <div class="result-row mt-2">
                                <span class="result-label-lg">เป็นเงินทั้งสิ้น:</span>
                                <span class="result-value-lg-gold" id="goldTotal">0 บาท</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-6">
                <div class="pos-card">
                    <div>
                        <h2 class="card-silver-title">
                            <i class="bi bi-coin text-secondary"></i> คำนวณราคาเงิน
                        </h2>
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <button class="btn btn-fetch-inline btn-fetch-silver" id="btnGetSilver">
                                    <i class="bi bi-cloud-download-fill me-1"></i> กดดึงราคาเงินล่าสุด
                                </button>
                                <label for="silverPrice" class="form-label">ราคาเงินประจำวัน (บาท)</label>
                                <input type="number" id="silverPrice" class="form-control" step="any" min="0">
                                <div class="invalid-feedback" id="silverPriceError"></div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="silverPercent" class="form-label">เปอร์เซ็นต์ (%) </label>
                                <input type="number" id="silverPercent" class="form-control" step="any" min="0" max="100">
                                <div class="invalid-feedback" id="silverPercentError"></div>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="silverWeight" class="form-label">น้ำหนัก (กรัม)</label>
                                <input type="number" id="silverWeight" class="form-control" step="any" min="0">
                                <div class="invalid-feedback" id="silverWeightError"></div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="row g-2">
                            <div class="col-8">
                                <button class="btn btn-calc btn-silver w-100" id="btnCalcSilver">
                                    <i class="bi bi-play-circle-fill"></i> คำนวณราคาเงิน
                                </button>
                            </div>
                            <div class="col-4">
                                <button class="btn btn-clear w-100" id="btnClearSilver">ล้างค่า</button>
                            </div>
                        </div>

                        <div class="result-box-silver">
                            <div class="result-row">
                                <span class="result-label">ราคาต่อกรัม:</span>
                                <span class="result-value-sm" id="silverPerGram">0.00 บาท</span>
                            </div>
                            <div class="result-row mt-2">
                                <span class="result-label-lg">เป็นเงินทั้งสิ้น:</span>
                                <span class="result-value-lg-silver" id="silverTotal">0 บาท</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // CONFIG
        const CONFIG = {
            FETCH_TIMEOUT: 8000,
            API_PROXY: 'https://api.allorigins.win/get?url=',
            GOLD_APIS: [
                'https://www.goldtraders.or.th/',
                'https://thaigold.info/'
            ],
            SILVER_APIS: [
                'https://www.goldguide.in.th/'
            ]
        };

        // VALIDATION
        function isValidNumber(value, min = 0, max = null) {
            const num = parseFloat(value);
            if (isNaN(num) || num < min) return false;
            if (max !== null && num > max) return false;
            return true;
        }

        function validateGoldInputs() {
            let isValid = true;
            const priceEl = document.getElementById('goldPrice');
            const percentEl = document.getElementById('goldPercent');
            const weightEl = document.getElementById('goldWeight');

            // Clear previous errors
            priceEl.classList.remove('is-invalid');
            percentEl.classList.remove('is-invalid');
            weightEl.classList.remove('is-invalid');
            document.getElementById('goldPriceError').textContent = '';
            document.getElementById('goldPercentError').textContent = '';
            document.getElementById('goldWeightError').textContent = '';

            // Validate Price
            if (!priceEl.value || !isValidNumber(priceEl.value, 0)) {
                priceEl.classList.add('is-invalid');
                document.getElementById('goldPriceError').textContent = 'กรุณากรอกราคารับซื้อทอง (≥ 0)';
                isValid = false;
            }

            // Validate Percent
            if (!percentEl.value || !isValidNumber(percentEl.value, 0, 100)) {
                percentEl.classList.add('is-invalid');
                document.getElementById('goldPercentError').textContent = 'กรุณากรอกเปอร์เซ็นต์ (0-100)';
                isValid = false;
            }

            // Validate Weight
            if (!weightEl.value || !isValidNumber(weightEl.value, 0)) {
                weightEl.classList.add('is-invalid');
                document.getElementById('goldWeightError').textContent = 'กรุณากรอกน้ำหนัก (≥ 0)';
                isValid = false;
            }

            return isValid;
        }

        function validateSilverInputs() {
            let isValid = true;
            const priceEl = document.getElementById('silverPrice');
            const percentEl = document.getElementById('silverPercent');
            const weightEl = document.getElementById('silverWeight');

            // Clear previous errors
            priceEl.classList.remove('is-invalid');
            percentEl.classList.remove('is-invalid');
            weightEl.classList.remove('is-invalid');
            document.getElementById('silverPriceError').textContent = '';
            document.getElementById('silverPercentError').textContent = '';
            document.getElementById('silverWeightError').textContent = '';

            // Validate Price
            if (!priceEl.value || !isValidNumber(priceEl.value, 0)) {
                priceEl.classList.add('is-invalid');
                document.getElementById('silverPriceError').textContent = 'กรุณากรอกราคาเงิน (≥ 0)';
                isValid = false;
            }

            // Validate Percent
            if (!percentEl.value || !isValidNumber(percentEl.value, 0, 100)) {
                percentEl.classList.add('is-invalid');
                document.getElementById('silverPercentError').textContent = 'กรุณากรอกเปอร์เซ็นต์ (0-100)';
                isValid = false;
            }

            // Validate Weight
            if (!weightEl.value || !isValidNumber(weightEl.value, 0)) {
                weightEl.classList.add('is-invalid');
                document.getElementById('silverWeightError').textContent = 'กรุณากรอกน้ำหนัก (≥ 0)';
                isValid = false;
            }

            return isValid;
        }

        // FETCH WITH TIMEOUT
        async function fetchWithTimeout(url, timeout = CONFIG.FETCH_TIMEOUT) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }

        // FETCH GOLD PRICE
        async function fetchThaiGoldPrice() {
            const btn = document.getElementById('btnGetGold');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังดึงราคาทอง...';
            btn.disabled = true;

            for (const apiUrl of CONFIG.GOLD_APIS) {
                try {
                    const proxyUrl = CONFIG.API_PROXY + encodeURIComponent(apiUrl);
                    const data = await fetchWithTimeout(proxyUrl);
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    
                    const buyPriceEl = doc.getElementById('lblGoldBarBuy');
                    if (buyPriceEl) {
                        const buyPrice = buyPriceEl.innerText.trim().replace(/,/g, '');
                        const priceValue = parseFloat(buyPrice);
                        if (!isNaN(priceValue) && priceValue > 0) {
                            document.getElementById('goldPrice').value = priceValue;
                            btn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> ดึงราคาสมาคมฯ สำเร็จ';
                            calculateGold();
                            setTimeout(() => {
                                btn.innerHTML = originalHTML;
                                btn.disabled = false;
                            }, 2000);
                            return;
                        }
                    }

                    const tds = doc.querySelectorAll('td');
                    for (let td of tds) {
                        if (td.innerText.includes('รับซื้อ') && td.innerText.includes('ทองแท่ง')) {
                            let priceMatch = td.nextElementSibling?.innerText.replace(/,/g, '').match(/\d+/);
                            if (priceMatch) {
                                document.getElementById('goldPrice').value = parseFloat(priceMatch[0]);
                                btn.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i> ดึงจากระบบสำรองสำเร็จ';
                                calculateGold();
                                setTimeout(() => {
                                    btn.innerHTML = originalHTML;
                                    btn.disabled = false;
                                }, 2000);
                                return;
                            }
                        }
                    }
                } catch (error) {
                    console.warn(`Failed to fetch from ${apiUrl}:`, error.message);
                    continue;
                }
            }

            btn.innerHTML = originalHTML;
            btn.disabled = false;
            document.getElementById('goldPriceError').textContent = 'ดึงราคาล้มเหลว! โปรดกรอกราคาด้วยตนเอง';
        }

        // FETCH SILVER PRICE
        async function fetchSilverPrice() {
            const btn = document.getElementById('btnGetSilver');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังดึงราคาเงิน...';
            btn.disabled = true;

            for (const apiUrl of CONFIG.SILVER_APIS) {
                try {
                    const proxyUrl = CONFIG.API_PROXY + encodeURIComponent(apiUrl);
                    const data = await fetchWithTimeout(proxyUrl);
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    
                    const tds = doc.querySelectorAll('table td');
                    let silverPrice = 0;
                    
                    for (let i = 0; i < tds.length; i++) {
                        if (tds[i].innerText.includes('ราคาเงินแท้') || tds[i].innerText.includes('เนื้อเงิน')) {
                            const priceMat = tds[i + 1]?.innerText.replace(/,/g, '').match(/\d+/);
                            if (priceMat) {
                                silverPrice = parseInt(priceMat[0]);
                                break;
                            }
                        }
                    }

                    if (silverPrice > 0) {
                        document.getElementById('silverPrice').value = silverPrice;
                        btn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> ดึงราคาเงินสำเร็จ';
                        calculateSilver();
                        setTimeout(() => {
                            btn.innerHTML = originalHTML;
                            btn.disabled = false;
                        }, 2000);
                        return;
                    }
                } catch (error) {
                    console.warn(`Failed to fetch from ${apiUrl}:`, error.message);
                    continue;
                }
            }

            btn.innerHTML = originalHTML;
            btn.disabled = false;
            document.getElementById('silverPriceError').textContent = 'ดึงราคาล้มเหลว! โปรดกรอกราคาด้วยตนเอง';
        }

        // CLOCK
        function updateClock() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            document.getElementById('liveClock').innerText = now.toLocaleDateString('th-TH', options);
        }

        // CALCULATE GOLD
        function calculateGold() {
            if (!validateGoldInputs()) {
                document.getElementById('goldPerGram').innerText = '0.00 บาท';
                document.getElementById('goldTotal').innerText = '0 บาท';
                return;
            }

            const price = parseFloat(document.getElementById('goldPrice').value) || 0;
            const percent = parseFloat(document.getElementById('goldPercent').value) || 0;
            const weight = parseFloat(document.getElementById('goldWeight').value) || 0;

            const pricePerGram = Math.trunc(price * (percent / 100) * 0.0656);
            const total = Math.trunc(pricePerGram * weight);

            document.getElementById('goldPerGram').innerText = pricePerGram.toLocaleString('th-TH') + " บาท";
            document.getElementById('goldTotal').innerText = total.toLocaleString('th-TH') + " บาท";
        }

        // CALCULATE SILVER
        function calculateSilver() {
            if (!validateSilverInputs()) {
                document.getElementById('silverPerGram').innerText = '0.00 บาท';
                document.getElementById('silverTotal').innerText = '0 บาท';
                return;
            }

            const price = parseFloat(document.getElementById('silverPrice').value) || 0;
            const percent = parseFloat(document.getElementById('silverPercent').value) || 0;
            const weight = parseFloat(document.getElementById('silverWeight').value) || 0;

            const pricePerGram = Math.trunc((price - 50) * (percent / 100) * 0.0656);
            const total = Math.trunc(pricePerGram * weight);

            document.getElementById('silverPerGram').innerText = pricePerGram.toLocaleString('th-TH') + " บาท";
            document.getElementById('silverTotal').innerText = total.toLocaleString('th-TH') + " บาท";
        }

        // CLEAR GOLD
        function clearGold() {
            document.getElementById('goldPrice').value = '';
            document.getElementById('goldPercent').value = '';
            document.getElementById('goldWeight').value = '';
            document.getElementById('goldPrice').classList.remove('is-invalid');
            document.getElementById('goldPercent').classList.remove('is-invalid');
            document.getElementById('goldWeight').classList.remove('is-invalid');
            document.getElementById('goldPriceError').textContent = '';
            document.getElementById('goldPercentError').textContent = '';
            document.getElementById('goldWeightError').textContent = '';
            calculateGold();
        }

        // CLEAR SILVER
        function clearSilver() {
            document.getElementById('silverPrice').value = '';
            document.getElementById('silverPercent').value = '';
            document.getElementById('silverWeight').value = '';
            document.getElementById('silverPrice').classList.remove('is-invalid');
            document.getElementById('silverPercent').classList.remove('is-invalid');
            document.getElementById('silverWeight').classList.remove('is-invalid');
            document.getElementById('silverPriceError').textContent = '';
            document.getElementById('silverPercentError').textContent = '';
            document.getElementById('silverWeightError').textContent = '';
            calculateSilver();
        }

        // EVENT LISTENERS
        document.addEventListener('DOMContentLoaded', () => {
            // Clock
            setInterval(updateClock, 1000);
            updateClock();

            // Gold Card
            document.getElementById('btnGetGold').addEventListener('click', fetchThaiGoldPrice);
            document.getElementById('btnCalcGold').addEventListener('click', calculateGold);
            document.getElementById('btnClearGold').addEventListener('click', clearGold);
            document.getElementById('goldPrice').addEventListener('input', calculateGold);
            document.getElementById('goldPercent').addEventListener('input', calculateGold);
            document.getElementById('goldWeight').addEventListener('input', calculateGold);

            // Silver Card
            document.getElementById('btnGetSilver').addEventListener('click', fetchSilverPrice);
            document.getElementById('btnCalcSilver').addEventListener('click', calculateSilver);
            document.getElementById('btnClearSilver').addEventListener('click', clearSilver);
            document.getElementById('silverPrice').addEventListener('input', calculateSilver);
            document.getElementById('silverPercent').addEventListener('input', calculateSilver);
            document.getElementById('silverWeight').addEventListener('input', calculateSilver);
        });
    </script>
</body>
</html>
