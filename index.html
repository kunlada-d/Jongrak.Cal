<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณราคาทอง / เงิน </title>
    <link rel="icon" type="image/png" sizes="16x16" href="https://lh3.googleusercontent.com/d/1Vhd82IcG0O8DZ4QfwYyVCsCPVtVtivrd"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient-start: #4a0000;
            --bg-gradient-end: #1a0000;
            --primary-red: #B71C1C;
            --hover-red: #D32F2F;
            --accent-red: #F44336;
            --light-red-bg: #FFEBEE;
            --dark-gray: #37474F;
            --hover-gray: #263238;
            --light-gray-bg: #ECEFF1;
            --card-radius: 30px;
            --input-height: 70px;
            --button-height: 70px;
        }

        body {
            font-family: 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 100%; 
        }

        .header-title {
            font-size: 2.8rem;
            font-weight: 700;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: #FFFFFF;
            letter-spacing: 1px;
        }

        .header-clock {
            font-size: 1.6rem;
            font-weight: 400;
            color: #FFCDD2;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .pos-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: var(--card-radius);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 35px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pos-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .card-gold-title {
            color: var(--primary-red);
            font-size: 2rem;
            font-weight: 700;
            border-bottom: 4px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-silver-title {
            color: var(--dark-gray);
            font-size: 2rem;
            font-weight: 700;
            border-bottom: 4px solid var(--dark-gray);
            padding-bottom: 10px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .form-label {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }

        .form-control {
            height: var(--input-height);
            font-size: 1.6rem;
            font-weight: 600;
            border: 2px solid #ced4da;
            border-radius: 15px !important;
            padding: 10px 20px;
            color: #000000;
            background-color: #ffffff;
        }

        .form-control:focus {
            border-color: var(--accent-red);
            box-shadow: 0 0 0 0.25rem rgba(244, 67, 54, 0.25);
            background-color: #ffffff;
            color: #000000;
        }

        .btn-fetch-inline {
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            padding: 6px 18px;
            margin-bottom: 8px;
            float: right;
            border: none;
            transition: all 0.2s;
        }
        .btn-fetch-gold { background-color: #FFE082; color: #5D4037; }
        .btn-fetch-gold:hover { background-color: #FFD54F; }
        .btn-fetch-silver { background-color: #CFD8DC; color: #37474F; }
        .btn-fetch-silver:hover { background-color: #B0BEC5; }

        .btn-calc {
            height: var(--button-height);
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 15px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-gold { background-color: var(--primary-red); color: white; border: none; }
        .btn-gold:hover { background-color: var(--hover-red); box-shadow: 0 6px 15px rgba(183, 28, 28, 0.4); }

        .btn-silver { background-color: var(--dark-gray); color: white; border: none; }
        .btn-silver:hover { background-color: var(--hover-gray); box-shadow: 0 6px 15px rgba(55, 71, 79, 0.4); }

        .btn-clear {
            height: var(--button-height);
            font-size: 1.3rem;
            font-weight: 600;
            border-radius: 15px;
            background-color: #e0e0e0;
            color: #333;
            border: none;
        }
        .btn-clear:hover { background-color: #d6d6d6; }

        .result-box-gold {
            background-color: var(--light-red-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            border: 2px dashed rgba(183, 28, 28, 0.3);
        }

        .result-box-silver {
            background-color: var(--light-gray-bg);
            border-radius: 20px;
            padding: 20px;
            margin-top: 25px;
            border: 2px dashed rgba(55, 71, 79, 0.3);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .result-row:not(:last-child) { border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .result-label { font-size: 1.2rem; font-weight: 500; color: #555555; }
        .result-value-sm { font-size: 1.6rem; font-weight: 700; color: #222222; }
        .result-label-lg { font-size: 1.5rem; font-weight: 700; color: #000000; }
        .result-value-lg-gold { font-size: 2.6rem; font-weight: 800; color: var(--primary-red); text-shadow: 1px 1px 0px #fff; }
        .result-value-lg-silver { font-size: 2.6rem; font-weight: 800; color: var(--dark-gray); text-shadow: 1px 1px 0px #fff; }

        @media (max-width: 768px) {
            .header-title { font-size: 2rem; }
            .header-clock { font-size: 1.2rem; padding: 6px 15px; }
            .pos-card { padding: 20px; margin-bottom: 20px; }
            .card-gold-title, .card-silver-title { font-size: 1.6rem; }
            .form-label { font-size: 1.1rem; }
            .form-control { font-size: 1.4rem; height: 60px; }
            .btn-calc, .btn-clear { height: 60px; font-size: 1.3rem; }
            .result-value-lg-gold, .result-value-lg-silver { font-size: 2.2rem; }
            .btn-fetch-inline { padding: 4px 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container-fluid px-4 px-md-5 my-auto">
        <header class="text-center mb-4 mb-md-5">
            <h1 class="header-title mb-3">
                <i class="bi bi-calculator-fill me-2 text-warning"></i>โปรแกรมคำนวณราคาทอง / เงิน
            </h1>
            <div class="header-clock" id="liveClock">กำลังโหลดวันที่และเวลา...</div>
        </header>

        <div class="row g-4 justify-content-center">
            
            <!-- คำนวณราคาทอง -->
            <div class="col-12 col-xl-6">
                <div class="pos-card">
                    <div>
                        <h2 class="card-gold-title">
                            <i class="bi bi-trophy-fill text-warning"></i> คำนวณราคาทอง
                        </h2>
                        
                        <div class="row g-3">
                            <div class="col-12">
                               
                                <button class="btn btn-fetch-inline btn-fetch-gold" id="btnGetGold" onclick="fetchThaiGoldPrice()">
                                    <i class="bi bi-cloud-download-fill me-1"></i> กดดึงราคารับซื้อจากสมาคมฯ
                                </button>
                                <label for="goldPrice" class="form-label">ราคารับซื้อประจำวัน (บาท)</label>
                                <input type="number" id="goldPrice" class="form-control" step="any" oninput="calculateGold()">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="goldPercent" class="form-label">เปอร์เซ็นต์ (%) </label>
                                <input type="number" id="goldPercent" class="form-control" step="any" oninput="calculateGold()">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="goldWeight" class="form-label">น้ำหนัก (กรัม)</label>
                                <input type="number" id="goldWeight" class="form-control" step="any" oninput="calculateGold()">
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="row g-2">
                            <div class="col-8">
                                <button class="btn btn-calc btn-gold w-100" onclick="calculateGold()">
                                    <i class="bi bi-play-circle-fill"></i> คำนวณราคาทอง
                                </button>
                            </div>
                            <div class="col-4">
                                <button class="btn btn-clear w-100" onclick="clearGold()">ล้างค่า</button>
                            </div>
                        </div>

                        <div class="result-box-gold">
                            <div class="result-row">
                                <span class="result-label">ทองราคาต่อกรัม:</span>
                                <span class="result-value-sm" id="goldPerGram">0.00 บาท</span>
                            </div>
                            <div class="result-row mt-2">
                                <span class="result-label-lg">เป็นเงินทั้งสิ้น:</span>
                                <span class="result-value-lg-gold" id="goldTotal">0 บาท</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- คำนวณราคาเงิน -->
            <div class="col-12 col-xl-6">
                <div class="pos-card">
                    <div>
                        <h2 class="card-silver-title">
                            <i class="bi bi-coin text-secondary"></i> คำนวณราคาเงิน
                        </h2>
                        
                        <div class="row g-3">
                            <div class="col-12">
                                <button class="btn btn-fetch-inline btn-fetch-silver" id="btnGetSilver" onclick="fetchSilverPrice()">
                                    <i class="bi bi-cloud-download-fill me-1"></i> กดดึงราคาเงินล่าสุด
                                </button>
                                <label for="silverPrice" class="form-label">ราคาเงินประจำวัน (บาท)</label>
                                <input type="number" id="silverPrice" class="form-control" step="any" oninput="calculateSilver()">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="silverPercent" class="form-label">เปอร์เซ็นต์ (%) </label>
                                <input type="number" id="silverPercent" class="form-control" step="any" oninput="calculateSilver()">
                            </div>
                            <div class="col-12 col-sm-6">
                                <label for="silverWeight" class="form-label">น้ำหนัก (กรัม)</label>
                                <input type="number" id="silverWeight" class="form-control" step="any" oninput="calculateSilver()">
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="row g-2">
                            <div class="col-8">
                                <button class="btn btn-calc btn-silver w-100" onclick="calculateSilver()">
                                    <i class="bi bi-play-circle-fill"></i> คำนวณราคาเงิน
                                </button>
                            </div>
                            <div class="col-4">
                                <button class="btn btn-clear w-100" onclick="clearSilver()">ล้างค่า</button>
                            </div>
                        </div>

                        <div class="result-box-silver">
                            <div class="result-row">
                                <span class="result-label">ราคาต่อกรัม:</span>
                                <span class="result-value-sm" id="silverPerGram">0.00 บาท</span>
                            </div>
                            <div class="result-row mt-2">
                                <span class="result-label-lg">เป็นเงินทั้งสิ้น:</span>
                                <span class="result-value-lg-silver" id="silverTotal">0 บาท</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

   <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('liveClock').innerText = now.toLocaleDateString('th-TH', options);
        }

       const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTQyauvcdno2tJgbCeH-FIeV8d_YgGiiUOpT3w_u0RoMEvRzQYWSF8_KZhYY0hVdExlPi3RmxfYUGJc/pub?gid=1788205936&single=true&output=csv';

// ฟังก์ชันดึงข้อมูลรวมจาก Google Sheet
async function fetchPricesFromSheet() {
    try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error('Network response was not ok');
        
        const data = await response.text();
        
        // แปลงข้อมูล CSV เป็น Array 2 มิติ [แถว][คอลัมน์]
        const rows = data.split('\n').map(row => row.split(','));
        
        // ในระบบพิกัดของ Excel/Sheets:
        // คอลัมน์ D คือ ดัชนีที่ 3 (A=0, B=1, C=2, D=3)
        // แถวที่ 3 คือ ดัชนีที่ 2 (แถว 1=0, แถว 2=1, แถว 3=2) -> ค่าทอง (D3)
        // แถวที่ 5 คือ ดัชนีที่ 4 (แถว 4=3, แถว 5=4) -> ค่าเงิน (D5)
        
        const goldPriceText = rows[2] && rows[2][3] ? rows[2][3].trim() : null;
        const silverPriceText = rows[4] && rows[4][3] ? rows[4][3].trim() : null;
        
        return {
            gold: goldPriceText ? parseFloat(goldPriceText.replace(/[^0-9.]/g, '')) : null,
            silver: silverPriceText ? parseFloat(silverPriceText.replace(/[^0-9.]/g, '')) : null
        };
    } catch (error) {
        console.error("เกิดข้อผิดพลาดในการดึงข้อมูลจาก Google Sheet:", error);
        return null;
    }
}

// ฟังก์ชันดึงราคาทอง
async function fetchThaiGoldPrice() {
    const btn = document.getElementById('btnGetGold');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังดึงจาก Google Sheet...';
    btn.disabled = true;

    const prices = await fetchPricesFromSheet();

    if (prices && prices.gold) {
        document.getElementById('goldPrice').value = prices.gold;
        btn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> ดึงราคาทองสำเร็จ';
        calculateGold();
    } else {
        btn.innerHTML = 'ดึงพลาด! โปรดกรอกมือ';
    }

    setTimeout(() => { 
        btn.disabled = false; 
        btn.innerHTML = '<i class="bi bi-cloud-download-fill me-1"></i> กดดึงราคารับซื้อสมาคมฯ'; 
    }, 1000);
}

// ฟังก์ชันดึงราคาเงิน
async function fetchSilverPrice() {
    const btn = document.getElementById('btnGetSilver');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> กำลังดึงราคาเงิน...';
    btn.disabled = true;

    const prices = await fetchPricesFromSheet();

    if (prices && prices.silver) {
        document.getElementById('silverPrice').value = prices.silver;
        btn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> ดึงราคาเงินสำเร็จ';
        calculateSilver();
    } else {
        btn.innerHTML = 'ดึงพลาด! โปรดกรอกมือแทน';
    }

    setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-download-fill me-1"></i> กดดึงราคาเงินล่าสุด';
    }, 1000);
}

window.onload = function() {
    setInterval(updateClock, 1000);
    updateClock();
};
        function calculateGold() {
            const price = parseFloat(document.getElementById('goldPrice').value) || 0;
            const percent = parseFloat(document.getElementById('goldPercent').value) || 0;
            const weight = parseFloat(document.getElementById('goldWeight').value) || 0;

            const pricePerGram = Math.trunc(price * (percent / 100) * 0.0656);
            const total = Math.trunc(pricePerGram * weight);

            document.getElementById('goldPerGram').innerText = pricePerGram.toLocaleString('th-TH') + " บาท";
            document.getElementById('goldTotal').innerText = total.toLocaleString('th-TH') + " บาท";
        }

        function calculateSilver() {
            const price = parseFloat(document.getElementById('silverPrice').value) || 0;
            const percent = parseFloat(document.getElementById('silverPercent').value) || 0; 
            const weight = parseFloat(document.getElementById('silverWeight').value) || 0;

            const pricePerGram = Math.trunc((price - 50) * 0.99 * 0.0656);
            const total = Math.trunc(pricePerGram * (percent / 100))* weight;

            document.getElementById('silverPerGram').innerText = pricePerGram.toLocaleString('th-TH') + " บาท";
            document.getElementById('silverTotal').innerText = Math.trunc(total).toLocaleString('th-TH') + " บาท";
        }

        function clearGold() {
            document.getElementById('goldPrice').value = '';
            document.getElementById('goldPercent').value = '';
            document.getElementById('goldWeight').value = '';
            calculateGold();
        }

        function clearSilver() {
            document.getElementById('silverPrice').value = '';
            document.getElementById('silverPercent').value = ''; 
            document.getElementById('silverWeight').value = '';
            calculateSilver();
        }
    </script>
</body>
</html>
